<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 生日快乐</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="container" id="container">

    <!-- 步骤 1: 标题 -->
    <div class="step step-1" id="step1">
      <h1 class="title"><span data-node-name="greeting">嘿</span> <span data-node-name="name">朋友</span></h1>
      <p class="subtitle" data-node-name="greetingText">祝你生日快乐！</p>
    </div>

    <!-- 步骤 2: 生日宣言 -->
    <div class="step step-2" id="step2">
      <p class="big-text" data-node-name="text1">今天是你的生日！🎉</p>
    </div>

    <!-- 步骤 3: 对话气泡 -->
    <div class="step step-3" id="step3">
      <div class="chat-bubble">
        <p class="chat-text" data-node-name="textInChatBox">祝你生日快乐！</p>
        <span class="chat-send" data-node-name="sendButtonLabel">发送</span>
      </div>
    </div>

    <!-- 步骤 4: 思考 -->
    <div class="step step-4" id="step4">
      <p class="think" data-node-name="text2">我本来想说点什么的</p>
      <p class="think" data-node-name="text3">但是突然停住了</p>
      <p class="think"><span data-node-name="text4">因为我想给你一份</span> <strong data-node-name="text4Adjective">特别的</strong></p>
      <p class="think" data-node-name="text5Entry">因为，</p>
      <p class="think"><span data-node-name="text5Content">你是独一无二的</span> <span data-node-name="smiley">💕</span></p>
      <p class="big-letters"><span data-node-name="bigTextPart1">生</span><span data-node-name="bigTextPart2">日</span></p>
    </div>

    <!-- 步骤 5: 祝福 -->
    <div class="step step-5" id="step5">
      <div class="wish-final">
        <h3 class="wish-hbd" data-node-name="wishHeading">生日快乐！</h3>
        <h5 class="wish-text" data-node-name="wishText">愿你被这个世界温柔以待 ✨</h5>
      </div>
    </div>

    <!-- 步骤 6: 结尾 -->
    <div class="step step-6" id="step6">
      <p data-node-name="outroText">好了，这份惊喜你喜欢吗？</p>
      <p id="replay" data-node-name="replayText">点击这里再看一遍 🔄</p>
      <p class="last-smile" data-node-name="outroSmiley">💕</p>
    </div>

    <!-- 气球 -->
    <div class="balloons" id="balloons">
      <img src="img/ballon2.svg" alt=""><img src="img/ballon1.svg" alt=""><img src="img/ballon3.svg" alt="">
      <img src="img/ballon1.svg" alt=""><img src="img/ballon2.svg" alt=""><img src="img/ballon3.svg" alt="">
      <img src="img/ballon2.svg" alt=""><img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt="">
      <img src="img/ballon2.svg" alt=""><img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt="">
      <img src="img/ballon2.svg" alt=""><img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt="">
      <img src="img/ballon2.svg" alt=""><img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt="">
      <img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt=""><img src="img/ballon2.svg" alt="">
      <img src="img/ballon3.svg" alt=""><img src="img/ballon2.svg" alt=""><img src="img/ballon1.svg" alt="">
      <img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt=""><img src="img/ballon2.svg" alt="">
    </div>

    <!-- 粒子 -->
    <div class="particles" id="particles"></div>

    <!-- 许愿弹窗 -->
    <div class="wish-overlay" id="wishOverlay">
      <div class="wish-dialog">
        <div class="wish-dialog-header">
          <span class="wish-icon">🎂</span>
          <span class="wish-title">许个愿吧</span>
        </div>
        <p class="wish-hint">偷偷告诉我你的生日愿望 🤫</p>
        <input type="text" id="wishInput" class="wish-input" placeholder="写下你的愿望..." maxlength="200" />
        <button id="submitWish" class="wish-btn">提交愿望 ✨</button>
        <div id="wishConfirm" class="wish-confirm" style="display:none">
          <span class="confirm-icon">💕</span>
          <span>愿望收到啦！继续吧～</span>
        </div>
      </div>
    </div>

  </div>

  <!-- 音乐 -->
  <audio id="bgMusic" loop><source src="music/birthday.mp3" type="audio/mpeg"></audio>
  <button id="musicBtn" class="music-btn" title="播放/暂停">🔇</button>

  <script src="script/main.js"></script>
</body>
</html>
