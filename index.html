<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 生日快乐</title>
  <link rel="stylesheet" href="style/style.css">
</head>

<body>
  <div class="container">
    <div class="one">
      <h1><span data-node-name="greeting">嘿</span> <span data-node-name="name">朋友</span></h1>
      <p class="two" data-node-name="greetingText">祝你生日快乐！</p>
    </div>
    <div class="three">
      <p data-node-name="text1">今天是你的生日！🎉</p>
    </div>
    <div class="four">
      <div class="text-box">
        <p class="hbd-chatbox" data-node-name="textInChatBox">生日快乐！</p>
        <p class="fake-btn" data-node-name="sendButtonLabel">发送</p>
      </div>
    </div>
    <div class="five">
      <p class="idea-1" data-node-name="text2">我本来想说点什么的</p>
      <p class="idea-2" data-node-name="text3">但是突然停住了</p>
      <p class="idea-3"><span data-node-name="text4">因为我想给你一份</span> <strong data-node-name="text4Adjective">特别的</strong></p>
      <p class="idea-4" data-node-name="text5Entry">因为，</p>
      <p class="idea-5"><span data-node-name="text5Content">你是独一无二的</span> <span class="smiley" data-node-name="smiley">💕</span></p>
      <p class="idea-6"><span data-node-name="bigTextPart1">生</span><span data-node-name="bigTextPart2">日</span></p>
    </div>
    <div class="six">
      <div class="wish">
        <h3 class="wish-hbd" data-node-name="wishHeading">生日快乐！</h3>
        <h5 data-node-name="wishText">愿你被这个世界温柔以待 ✨</h5>
      </div>
    </div>
    <div class="seven">
      <div class="baloons">
        <img src="img/ballon2.svg" alt=""><img src="img/ballon1.svg" alt=""><img src="img/ballon3.svg" alt="">
        <img src="img/ballon1.svg" alt=""><img src="img/ballon2.svg" alt=""><img src="img/ballon3.svg" alt="">
        <img src="img/ballon2.svg" alt=""><img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt="">
        <img src="img/ballon2.svg" alt=""><img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt="">
        <img src="img/ballon2.svg" alt=""><img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt="">
        <img src="img/ballon2.svg" alt=""><img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt="">
        <img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt=""><img src="img/ballon2.svg" alt="">
        <img src="img/ballon3.svg" alt=""><img src="img/ballon2.svg" alt=""><img src="img/ballon1.svg" alt="">
        <img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt=""><img src="img/ballon2.svg" alt="">
        <img src="img/ballon3.svg" alt=""><img src="img/ballon1.svg" alt=""><img src="img/ballon2.svg" alt="">
      </div>
    </div>
    <div class="eight">
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/></svg>
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/></svg>
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/></svg>
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/></svg>
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/></svg>
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/></svg>
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/></svg>
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/></svg>
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/></svg>
    </div>
    <div class="nine">
      <p data-node-name="outroText">好了，这份惊喜你喜欢吗？</p>
      <p id="replay" data-node-name="replayText">点击这里再看一遍 🔄</p>
      <p class="last-smile" data-node-name="outroSmiley">💕</p>
    </div>
  </div>

  <!-- 许愿弹窗（fixed overlay，独立于 container） -->
  <div class="wish-overlay" id="wishOverlay">
    <div class="wish-dialog">
      <div class="wish-dialog-header">
        <span class="wish-icon">🎂</span>
        <span class="wish-title">许个愿吧</span>
      </div>
      <p class="wish-hint">偷偷告诉我你的生日愿望 🤫</p>
      <input type="text" id="wishInput" class="wish-input" placeholder="写下你的愿望..." maxlength="200" />
      <button id="submitWish" class="wish-btn">提交愿望 ✨</button>
      <div id="wishConfirm" class="wish-confirm" style="display:none">
        <span class="confirm-icon">💕</span>
        <span>愿望收到啦！继续吧～</span>
      </div>
    </div>
  </div>

  <!-- 音乐 -->
  <audio id="bgMusic" loop><source src="music/birthday.mp3" type="audio/mpeg"></audio>
  <button id="musicBtn" class="music-btn" title="播放/暂停">🔇</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>
  <script>
    // ===== 音频控制 =====
    (function() {
      var bgMusic = document.getElementById('bgMusic');
      var musicBtn = document.getElementById('musicBtn');
      var playing = false;
      musicBtn.onclick = function() {
        if (playing) { bgMusic.pause(); musicBtn.textContent = '🔇'; playing = false; }
        else { bgMusic.play().then(function() { musicBtn.textContent = '🔊'; playing = true; }).catch(function() {}); }
      };
    })();

    // ===== 动画主逻辑 =====
    var API_BASE = ''; // Cloudflare 反代后同域，留空即可

    fetch("customize.json").then(function(r) { return r.json(); }).then(function(data) {
      Object.keys(data).forEach(function(key) {
        var el = document.querySelector('[data-node-name*="' + key + '"]');
        if (el && data[key] !== "") {
          if (key === "imagePath") el.setAttribute("src", data[key]);
          else el.innerText = data[key];
        }
      });
      start();
    });

    function start() {
      var chat = document.querySelector(".hbd-chatbox");
      var hbd = document.querySelector(".wish-hbd");
      chat.innerHTML = chat.innerHTML.split("").map(function(c) { return "<span>" + c + "</span>"; }).join("");
      hbd.innerHTML = hbd.innerHTML.split("").map(function(c) { return "<span>" + c + "</span>"; }).join("");

      var tl = new TimelineMax();

      // 1. 标题
      tl.set(".container", { visibility: "visible" })
        .set(".one", { opacity: 1, pointerEvents: "auto" })
        .from(".one", 0.8, { opacity: 0, y: 30 })
        .from(".two", 0.5, { opacity: 0, y: 15 }, "+=0.2")
        .to(".one", 0.6, { opacity: 0, pointerEvents: "none" }, "+=2.5")
        .to(".two", 0.4, { opacity: 0 }, "-=0.4")

        // 2. 生日宣言
        .set(".three", { opacity: 1, pointerEvents: "auto" })
        .from(".three", 0.8, { opacity: 0, scale: 0.5, ease: Back.easeOut })
        .to(".three", 0.5, { opacity: 0, pointerEvents: "none" }, "+=2.5")

        // 3. 对话气泡
        .set(".four", { opacity: 1, pointerEvents: "auto" })
        .from(".four", 0.7, { scale: 0.2, opacity: 0, ease: Back.easeOut })
        .from(".fake-btn", 0.3, { scale: 0, opacity: 0 })
        .staggerTo(".hbd-chatbox span", 0.5, { visibility: "visible" }, 0.04)
        .to(".fake-btn", 0.15, { backgroundColor: "rgb(127,206,248)" })
        .to(".four", 0.5, { scale: 0, opacity: 0, pointerEvents: "none" }, "+=0.7")

        // 4. 思考
        .set(".idea-1", { opacity: 1, pointerEvents: "auto" })
        .from(".idea-1", 0.7, { opacity: 0, y: -20, rotationX: 5, skewX: "15deg" })
        .to(".idea-1", 0.7, { opacity: 0, pointerEvents: "none", y: 20, skewX: "-15deg" }, "+=1.5")

        .set(".idea-2", { opacity: 1, pointerEvents: "auto" })
        .from(".idea-2", 0.7, { opacity: 0, y: -20, rotationX: 5, skewX: "15deg" })
        .to(".idea-2", 0.7, { opacity: 0, pointerEvents: "none", y: 20, skewX: "-15deg" }, "+=1.5")

        .set(".idea-3", { opacity: 1, pointerEvents: "auto" })
        .from(".idea-3", 0.7, { opacity: 0, y: -20, rotationX: 5, skewX: "15deg" })
        .to(".idea-3 strong", 0.5, { scale: 1.3, x: 10, backgroundColor: "rgb(21,161,237)", color: "#fff" })
        .to(".idea-3", 0.7, { opacity: 0, pointerEvents: "none", y: 20, skewX: "-15deg" }, "+=1.5")

        .set(".idea-4", { opacity: 1, pointerEvents: "auto" })
        .from(".idea-4", 0.7, { opacity: 0, y: -20, rotationX: 5, skewX: "15deg" })
        .to(".idea-4", 0.7, { opacity: 0, pointerEvents: "none", y: 20, skewX: "-15deg" }, "+=1.5")

        .set(".idea-5", { opacity: 1, pointerEvents: "auto" })
        .from(".idea-5", 0.7, { rotationX: 15, rotationZ: -10, skewY: "-5deg", y: 50, z: 10, opacity: 0 }, "+=0.5")
        .to(".idea-5 .smiley", 0.7, { rotation: 90, x: 8 }, "+=0.4")
        .to(".idea-5", 0.7, { scale: 0, opacity: 0, pointerEvents: "none" }, "+=2")

        // 5. SO
        .set(".idea-6", { opacity: 1, pointerEvents: "auto" })
        .staggerFrom(".idea-6 span", 0.8, { scale: 3, opacity: 0, rotation: 15, ease: Expo.easeOut }, 0.2)
        .staggerTo(".idea-6 span", 0.8, { scale: 3, opacity: 0, rotation: -15, ease: Expo.easeOut }, 0.2, "+=1")
        .set(".idea-6", { pointerEvents: "none" })

        // 6. 气球 + 祝福
        .staggerFromTo(".baloons img", 2.5, { opacity: 0.9, y: 1400 }, { opacity: 1, y: -1000 }, 0.2)
        .set(".six", { opacity: 1, pointerEvents: "auto" })
        .from(".wish", 0.6, { scale: 3, opacity: 0, rotationZ: -15 }, "-=2")
        .staggerFrom(".wish-hbd span", 0.7, { opacity: 0, y: -50, rotation: 150, skewX: "30deg", ease: Elastic.easeOut.config(1, 0.5) }, 0.1)
        .staggerFromTo(".wish-hbd span", 0.7, { scale: 1.4, rotationY: 150 }, { scale: 1, rotationY: 0, color: "#ff69b4", ease: Expo.easeOut }, 0.1, "party")
        .from(".wish h5", 0.5, { opacity: 0, y: 10, skewX: "-15deg" }, "party")
        .staggerTo(".eight svg", 1.5, { visibility: "visible", opacity: 0, scale: 80, repeat: 3, repeatDelay: 1.4 }, 0.3)

        // 7. 许愿弹窗（暂停等待）
        .set(".six", { opacity: 0, pointerEvents: "none" })
        .call(function() {
          var overlay = document.getElementById("wishOverlay");
          overlay.style.display = "flex";
          TweenMax.from(".wish-dialog", 0.6, { opacity: 0, scale: 0.85, y: 30, ease: Back.easeOut });
          document.getElementById("wishInput").focus();
        })
        .addPause()

        // 许愿后继续
        .to(".wish-overlay", 0.5, { opacity: 0, ease: Power2.easeIn })
        .set("#wishOverlay", { display: "none", opacity: 1 })

        // 8. 结尾
        .set(".nine", { opacity: 1, pointerEvents: "auto" })
        .staggerFrom(".nine p", 1, { opacity: 0, y: -20, rotationX: 5, skewX: "15deg" }, 1.2)
        .to(".last-smile", 0.5, { rotation: 90 }, "+=1");

      // 许愿提交
      document.getElementById("submitWish").onclick = function() {
        var input = document.getElementById("wishInput");
        var val = input.value.trim();
        if (!val) { input.focus(); return; }
        // 发送到 Cloudflare Workers
        fetch(API_BASE + "/api/wish", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ wish: val, time: new Date().toISOString() })
        }).catch(function() {});
        // UI 反馈
        input.style.display = "none";
        document.getElementById("submitWish").style.display = "none";
        document.getElementById("wishConfirm").style.display = "block";
        TweenMax.from("#wishConfirm", 0.5, { opacity: 0, scale: 0.5, ease: Back.easeOut });
        // 1.5秒后继续动画
        setTimeout(function() { tl.resume(); }, 1500);
      };

      // 回车提交
      document.getElementById("wishInput").onkeydown = function(e) {
        if (e.key === "Enter") { e.preventDefault(); document.getElementById("submitWish").click(); }
      };

      // 重播
      document.getElementById("replay").onclick = function() {
        document.getElementById("wishInput").style.display = "";
        document.getElementById("submitWish").style.display = "";
        document.getElementById("wishConfirm").style.display = "none";
        tl.restart();
        return false;
      };
    }
  </script>
</body>
</html>
